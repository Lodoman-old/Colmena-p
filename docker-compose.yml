services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /opt/colmena/infrastructure/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "15432:5432"
    networks:
      - appnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "16379:6379"
    networks:
      - appnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      OSRM_URL: http://osrm-router:5000
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - appnet
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot idempotente: poligonos + migraciones. Corre en cada deploy.
  app-init:
    image: postgis/postgis:15-3.4
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PGHOST: postgres
    volumes:
      - /opt/colmena/deploy/init-app.sh:/init-app.sh:ro
      - /opt/colmena/db:/db:ro
      - /opt/colmena/infrastructure:/infrastructure:ro
    command: sh -c "bash /init-app.sh"
    networks:
      - appnet
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  osrm-router:
    image: osrm/osrm-backend
    # Auto-prepara los datos la primera vez (idempotente) y arranca el router
    command: sh -c 'if [ ! -f /data/guanajuato.osrm ]; then cp /pbf/guanajuato.osm.pbf /data/ && cd /data && osrm-extract -p /opt/car.lua guanajuato.osm.pbf && osrm-partition guanajuato.osrm && osrm-customize guanajuato.osrm; fi; exec osrm-routed --algorithm mld /data/guanajuato.osrm'
    volumes:
      - osrm_data:/data
      - /opt/colmena/osrm-data:/pbf:ro
    ports:
      - "5000:5000"
    networks:
      - appnet
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - /opt/colmena/src/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/colmena/src/web:/usr/share/nginx/html:ro
      - /opt/colmena/src/tiles-server:/usr/share/nginx/tiles:ro
    depends_on:
      - api
    networks:
      - appnet
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  osrm_data:

networks:
  appnet:
    driver: bridge